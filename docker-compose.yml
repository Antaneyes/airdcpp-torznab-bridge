services:
  airdcpp-bridge:
    image: ghcr.io/antaneyes/airdcpp-torznab-bridge:2.0.0-beta.1
    build: .
    container_name: airdcpp-bridge-v2
    ports:
      - "8001:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bridge-v2-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  bridge-v2-data:
