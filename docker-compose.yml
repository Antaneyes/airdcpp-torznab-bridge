services:
  airdcpp-bridge:
    image: ghcr.io/antaneyes/airdcpp-torznab-bridge:${BRIDGE_IMAGE_TAG:-beta}
    container_name: airdcpp-bridge
    ports:
      - "${BRIDGE_PORT:-8001}:8000"
    env_file:
      - ${BRIDGE_ENV_FILE:-.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - bridge-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  bridge-data:
