[project]
name = "airdcpp-torznab-bridge"
version = "2.0.0b1"
description = "Torznab and qBittorrent compatibility bridge for AirDC++"
requires-python = ">=3.13"
license = "GPL-3.0-only"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "pydantic-settings==2.14.2",
  "aiosqlite==0.22.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
